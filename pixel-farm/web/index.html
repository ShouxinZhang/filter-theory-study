<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>像素农场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="login" class="screen">
      <div class="panel login-panel">
        <h1>🌱 像素农场</h1>
        <p class="muted">种菜 · 收获 · 卖钱 · 升级</p>
        <button id="btn-google" class="btn big">用 Google 账号登录</button>
        <button id="btn-guest" class="btn big secondary">游客试玩</button>
        <p id="mode-note" class="muted small"></p>
      </div>
    </div>

    <div id="game" hidden>
      <header id="hud" class="panel">
        <span id="hud-name" class="name"></span>
        <span id="hud-level" class="level"></span>
        <span class="xp"><span id="hud-xp-fill"></span><em id="hud-xp-text"></em></span>
        <span class="coins"><img id="coin-icon" class="coin" alt="" /><b id="hud-coins">0</b></span>
        <span class="spacer"></span>
        <button id="btn-link" class="btn small" hidden>绑定 Google</button>
        <button id="btn-logout" class="btn small secondary">退出</button>
      </header>
      <div id="stage"></div>
      <footer id="toolbar" class="panel">
        <div id="tools"></div>
        <span class="spacer"></span>
        <button id="btn-harvest-all" class="btn">一键收获</button>
        <button id="btn-shop" class="btn">🏪 商店</button>
        <button id="btn-barn" class="btn">📦 仓库</button>
      </footer>
    </div>

    <div id="modal" hidden>
      <div class="panel modal-panel">
        <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="btn small">✕</button></div>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
