<svg xmlns="http://www.w3.org/2000/svg" data-htd-inline="1" viewBox="0 0 880 480" width="880" height="480" class="ec-svg">
  <style>
.ec-svg {
  font-family: var(--ec-font-prose);
  font-feature-settings: "pnum" on, "lnum" on, "liga" on;
}
.ec-card-bg {
  fill: var(--ec-card);
  stroke: var(--ec-border);
  stroke-width: 1;
}
.ec-title {
  fill: var(--ec-fg);
  font-size: 17px;
  font-weight: 600;
}
.ec-subtitle {
  fill: var(--ec-muted);
  font-size: 12.8px;
}
.ec-grid {
  stroke: var(--ec-rule);
  stroke-width: 1;
}
.ec-grid-subtle {
  stroke: var(--ec-rule);
  stroke-width: 0.8;
  stroke-dasharray: 3 4;
  opacity: 0.7;
}
.ec-axis {
  stroke: var(--ec-fg);
  stroke-width: 1.15;
}
.ec-tick {
  fill: var(--ec-muted);
  font-family: var(--ec-font-math);
  font-size: 12px;
  font-variant-numeric: lining-nums tabular-nums;
}
.ec-axis-label {
  fill: var(--ec-fg);
  font-size: 13.5px;
  font-weight: 400;
}
.ec-line {
  fill: none;
  stroke-width: 2.3;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.ec-line-thin {
  fill: none;
  stroke-width: 1.6;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.ec-line-dashed {
  stroke-dasharray: 7 5;
}
.ec-band-edge {
  fill: none;
  stroke-width: 1.15;
  stroke-dasharray: 4 3.5;
  opacity: 0.85;
}
.ec-ref-line {
  stroke: var(--ec-fg);
  stroke-width: 1.3;
  stroke-dasharray: 5 4;
  opacity: 0.85;
}
.ec-annot {
  fill: var(--ec-fg);
  font-size: 12.5px;
  font-weight: 400;
  paint-order: stroke;
  stroke: var(--ec-card);
  stroke-width: 4;
  stroke-linejoin: round;
}
.ec-annot-muted {
  fill: var(--ec-muted);
  font-size: 12px;
  paint-order: stroke;
  stroke: var(--ec-card);
  stroke-width: 4;
  stroke-linejoin: round;
}
.ec-legend-text {
  fill: var(--ec-fg);
  font-size: 13px;
  font-weight: 400;
}
.ec-math-fg {
  color: var(--ec-fg);
}
.ec-math-muted {
  color: var(--ec-muted);
}
.ec-m-var,
.ec-m-num {
  font-family: var(--ec-font-math);
  font-style: normal;
  font-weight: 400;
}
.ec-m-sub,
.ec-m-sub-i {
  font-family: var(--ec-font-math);
  font-style: normal;
  font-size: 74%;
  baseline-shift: sub;
  font-weight: 400;
}
.ec-s-primary { stroke: var(--ec-primary); }
.ec-s-secondary { stroke: var(--ec-secondary); }
.ec-s-accent { stroke: var(--ec-accent); }
.ec-s-aux { stroke: var(--ec-aux); }
.ec-s-fg { stroke: var(--ec-fg); }
.ec-f-primary { fill: var(--ec-primary); }
.ec-f-secondary { fill: var(--ec-secondary); }
.ec-f-accent { fill: var(--ec-accent); }
.ec-f-aux { fill: var(--ec-aux); }
.ec-f-fg { fill: var(--ec-fg); }
.ec-svg {
  /* Bridge html-tex-doc page theme variables with editorial light fallbacks */
  --ec-card: var(--card, #FAF9F5);
  --ec-fg: var(--fg, #141413);
  --ec-muted: var(--muted, #73726C);
  --ec-rule: var(--rule, #D1CFC5);
  --ec-border: var(--ui-border, #E2E0D8);

  /* Semantic series palette */
  --ec-primary: #629987;
  --ec-secondary: #EB6834;
  --ec-accent: #6A9BCC;
  --ec-aux: #827DBD;

  /* Typography: New Century + standard Songti + OpenType Math */
  --ec-font-prose: "C059", "New Century Schoolbook", "TeX Gyre Schola",
    "SimSun", "宋体", "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC",
    Georgia, serif;
  --ec-font-math: "Latin Modern Math", "TeX Gyre Schola Math", "STIXGeneral", serif;
}
  </style>
